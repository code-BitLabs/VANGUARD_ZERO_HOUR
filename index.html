<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      window.addEventListener(
        'error',
        function (event) {
          if (
            event &&
            typeof event.filename === 'string' &&
            /^(chrome|moz|safari)-extension:\/\//.test(event.filename)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        },
        true
      );
    </script>
    <title>VANGUARD: ZERO HOUR — Tactical 3D FPS</title>
    <meta
      name="description"
      content="Single-player AAA-inspired 3D browser FPS action game featuring 10 weapons, threat-tiered squad AI, driveable vehicles, aerial combat, and a 5-mission campaign across 4 warzones."
    />
    <meta property="og:title" content="VANGUARD: ZERO HOUR — Tactical 3D FPS" />
    <meta
      property="og:description"
      content="Single-player AAA-inspired 3D browser FPS action game featuring 10 weapons, threat-tiered squad AI, driveable vehicles, aerial combat, and a 5-mission campaign across 4 warzones."
    />
    <meta property="og:type" content="website" />
